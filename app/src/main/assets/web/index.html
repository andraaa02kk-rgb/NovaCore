<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css"></head><body><div id="bg"></div><main><header><span class="logo">NOVA<span>//</span>CORE</span><button onclick="show('settings')">SETTINGS</button></header><section id="home" class="page"><div class="eyebrow">SYSTEM PERFORMANCE / LIVE</div><h1>Control your<br><em>core.</em></h1><div class="grid" id="cards"></div><article class="profile"><div><small>SYSTEM PROFILE</small><h2>Hardware identity</h2><p id="identity">Reading device…</p></div><button onclick="details()">DETAILS →</button></article><article class="audio"><small>AUDIO CENTER</small><h2 id="track">No track selected</h2><div class="row"><button onclick="NovaBridge.openAudioPicker()">ADD MUSIC</button><button onclick="NovaBridge.pauseAudio()">PAUSE</button><button onclick="NovaBridge.resumeAudio()">PLAY</button><button onclick="NovaBridge.stopAudio()">STOP</button></div></article></section><section id="monitor" class="page hidden"><div class="eyebrow">MONITOR / ROLLING HISTORY</div><h1>Live <em>telemetry.</em></h1><div class="grid" id="monitorCards"></div><canvas id="chart"></canvas></section><section id="settings" class="page hidden"><div class="eyebrow">PREFERENCES</div><h1>Make it <em>yours.</em></h1><article class="panel"><h3>THEME</h3><div class="row"><button onclick="theme('black')">BLACK</button><button onclick="theme('cream')">CREAM</button><button onclick="theme('white')">WHITE</button></div><h3>BACKGROUND</h3><div class="row"><button onclick="NovaBridge.openBackgroundPicker('photo')">PHOTO</button><button onclick="NovaBridge.openBackgroundPicker('video')">VIDEO</button><button onclick="NovaBridge.resetBackground()">RESET</button></div><h3>PERFORMANCE</h3><div class="row"><button onclick="toggleBoost()">SAFE BOOST</button><button onclick="NovaBridge.enableOverlay()">MINI MONITOR</button><button onclick="NovaBridge.clearNovaCache()">CLEAR CACHE</button><button onclick="NovaBridge.exportDiagnosticReport()">EXPORT REPORT</button></div></article></section><nav><button onclick="show('home')">HOME</button><button onclick="show('monitor')">MONITOR</button><button onclick="show('settings')">SETTINGS</button></nav></main><dialog id="details"><button class="close" onclick="this.parentElement.close()">×</button><h2>System details</h2><pre id="detailText"></pre></dialog><script src="js/app.js"></script></body></html>
